  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .frame { max-width: 860px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', monospace; font-size: 0.64rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.45rem;
    }
    h1 {
      font-size: 1.55rem; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .plugin-name {
      font-family: 'Geist Mono', monospace; font-weight: 600;
      color: var(--color-accent); font-size: 0.94em;
    }
    .type-chip {
      font-family: 'Geist Mono', monospace; font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.13em; text-transform: uppercase; color: #2e5aa8;
      border: 1.2px solid #2e5aa8; border-radius: 999px;
      padding: 0.2rem 0.62rem; line-height: 1; background: rgba(46,90,168,0.06);
    }
    .sub { font-size: 0.78rem; color: var(--color-muted); margin-bottom: 1.1rem; }
    svg { width: 100%; display: block; }
