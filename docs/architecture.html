<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-canvas-preview · 架构图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'PingFang SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 0.4rem;
    }
    .sub { font-family: var(--font-sans); font-size: 0.85rem; color: var(--color-muted); margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · DeepSeek Harness Cordis Plugin</p>
    <h1>dsh-canvas-preview — 双平面插件架构</h1>
    <p class="sub">浏览器画板与 Node 导出引擎通过包私有 RPC 协作；Chrome 无头截图采用「轮询杀进程」抗字体墙</p>

    <svg viewBox="0 0 1080 760" width="1080" height="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch2-title arch2-desc">
      <title id="arch2-title">dsh-canvas-preview 双平面架构</title>
      <desc id="arch2-desc">架构图：左侧为用户与浏览器内的画板页签、产物通知卡、目录选择器；中部为包私有 RPC 通道；右侧为 Node 宿主的四个 RPC 处理器，驱动工作区扫描与 Chrome 无头导出引擎，最终产出 PNG/JPG/SVG 文件。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ═══ Zones ═══ -->
      <!-- CLIENT zone -->
      <rect x="56" y="96" width="356" height="560" rx="10"
            fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <rect x="168" y="88" width="132" height="16" rx="3" fill="#f5f5f5"/>
      <text x="234" y="100" fill="rgba(45,49,66,0.45)" font-size="10" font-weight="500" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.16em">CLIENT · 浏览器</text>

      <!-- HOST zone -->
      <rect x="700" y="96" width="324" height="560" rx="10"
            fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <rect x="808" y="88" width="108" height="16" rx="3" fill="#f5f5f5"/>
      <text x="862" y="100" fill="rgba(45,49,66,0.45)" font-size="10" font-weight="500" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.16em">HOST · NODE.JS</text>

      <!-- ═══ Arrows (behind nodes) ═══ -->
      <!-- 用户 → 画板页签 -->
      <line x1="212" y1="196" x2="248" y2="196" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>

      <!-- 画板页签 → RPC (host.call) -->
      <path d="M 412,180 H 620 Q 632,180 632,192 V 224" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>

      <!-- 通知卡 → RPC -->
      <path d="M 412,340 H 608 Q 620,340 620,328 V 296" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>

      <!-- RPC → 扫描 -->
      <path d="M 796,356 V 428" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>

      <!-- RPC → 导出引擎 (coral) -->
      <path d="M 940,356 V 428" fill="none" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

      <!-- 扫描 ← 工作区 (dashed) -->
      <line x1="1024" y1="472" x2="988" y2="472" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- 目录选择器 → RPC (dashed) -->
      <path d="M 412,548 H 636 Q 648,548 648,536 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- 导出引擎 → 产物 (coral) -->
      <path d="M 760,540 H 496" fill="none" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

      <!-- ═══ Arrow labels (masked) ═══ -->
      <rect x="214" y="172" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="184" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">使用</text>

      <rect x="440" y="158" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="478" y="170" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">host.call</text>

      <rect x="436" y="348" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="478" y="360" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pickDir</text>

      <rect x="540" y="520" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="596" y="532" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">导出 PNG/JPG/SVG</text>

      <rect x="806" y="382" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="832" y="394" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">扫描</text>

      <rect x="106" y="170" width="40" height="16" rx="3" fill="transparent" stroke="rgba(122,131,153,0.45)" stroke-width="1"/>
      <text x="126" y="182" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>

      <rect x="258" y="146" width="44" height="16" rx="3" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
      <text x="280" y="158" fill="rgba(45,49,66,0.80)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="330" y="184" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">画板页签</text>

      <text x="330" y="220" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">预览·宽度·深色·另存</text>

      <rect x="248" y="296" width="164" height="92" rx="8" fill="#f5f5f5"/>

      <rect x="258" y="306" width="44" height="16" rx="3" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
      <text x="280" y="318" fill="rgba(45,49,66,0.80)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARD</text>
      <text x="330" y="344" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">产物通知卡</text>
      <text x="330" y="364" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">shell.overlay</text>
      <text x="330" y="380" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">缩略图·拖动·定位</text>

      <!-- 目录选择器 -->
      <rect x="248" y="504" width="164" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="248" y="504" width="164" height="88" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1.2" stroke-dasharray="5,4"/>
      <rect x="258" y="514" width="36" height="16" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="276" y="526" fill="rgba(45,49,66,0.60)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OS</text>
      <text x="330" y="550" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">目录选择器</text>
      <text x="330" y="570" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">原生 save-as</text>
      <text x="330" y="586" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">另存为 · 更改位置</text>

      <!-- 产物（CLIENT 左下） -->
      <rect x="248" y="616" width="248" height="0" rx="8" fill="none"/>
      <rect x="264" y="608" width="232" height="0" rx="8" fill="none"/>

      <!-- ═══ HOST nodes ═══ -->

      <!-- RPC 处理器 (focal) -->
      <rect x="700" y="132" width="324" height="224" rx="8" fill="#f5f5f5"/>
      <rect x="700" y="132" width="324" height="224" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
      <rect x="712" y="144" width="52" height="18" rx="3" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="1"/>
      <text x="738" y="157" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RPC</text>
      <text x="862" y="190" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">harness.handle × 4</text>
      <text x="862" y="218" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">canvas/list · canvas/read</text>
      <text x="862" y="240" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">canvas/export · canvas/reveal</text>
      <text x="862" y="268" fill="rgba(45,49,66,0.55)" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">会话沙箱策略直传</text>
      <text x="862" y="290" fill="rgba(45,49,66,0.55)" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">shell + subprocess 双执行路径</text>
      <text x="862" y="326" fill="#eb6c36" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">每步硬超时 · 永不挂起</text>

      <!-- 工作区扫描 -->
      <rect x="700" y="428" width="192" height="88" rx="8" fill="#f5f5f5"/>

      <rect x="710" y="438" width="36" height="16" rx="3" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>

      <text x="796" y="474" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">工作区扫描</text>
      <text x="796" y="494" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">fs + sessionQuery</text>
      <text x="796" y="510" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">4s 签名轮询</text>

      <!-- 导出引擎 -->
      <rect x="760" y="428" width="264" height="112" rx="8" fill="#f5f5f5"/>
      <rect x="760" y="428" width="264" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="770" y="438" width="48" height="16" rx="3" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
      <text x="794" y="450" fill="rgba(45,49,66,0.80)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHOT</text>
      <text x="892" y="476" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chrome 无头截图引擎</text>
      <text x="892" y="498" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">后台启动 · 轮询杀进程 · 2x</text>
      <text x="892" y="516" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">cp→PNG · sips→JPG85</text>
      <text x="892" y="534" fill="rgba(45,49,66,0.55)" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">SVG 直提 &lt;svg&gt; 无需 Chrome</text>

      <!-- 产物节点：放 CLIENT 左下，避开重叠 -->
      <rect x="248" y="600" width="248" height="0" fill="none"/>

      <!-- 产物（独立，位于两 zone 之间下方空白带） -->
      <rect x="440" y="608" width="200" height="0" fill="none"/>

      <!-- 产物节点实绘：居中底部 -->
      <rect x="440" y="600" width="200" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="600" width="200" height="56" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="450" y="608" width="44" height="16" rx="3" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="1"/>
      <text x="472" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="540" y="632" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PNG · JPG · SVG</text>

      <!-- 工作区注释 -->
