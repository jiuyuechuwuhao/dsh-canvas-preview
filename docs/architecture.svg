<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">dsh-canvas-preview 双平面架构</title>
      <desc id="arch-desc">架构图：左侧用户在浏览器使用画板页签与通知卡，中部 Client 平面的三个组件通过 host.call 调用 Host 平面的 RPC 处理器，后者驱动工作区扫描与 Chrome 无头导出引擎，最终产出 PNG/JPG 文件。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: CLIENT -->
      <rect x="300" y="72" width="330" height="380" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="418" y="76" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="466" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CLIENT · 浏览器</text>

      <!-- Zone: HOST -->
      <rect x="676" y="72" width="364" height="380" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="806" y="76" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="858" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">HOST · NODE.JS</text>

      <!-- Arrows (behind nodes) -->
      <!-- 用户→画板页签 -->
      <line x1="204" y1="176" x2="300" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 画板页签→RPC -->
      <path d="M 560,168 H 636 Q 644,168 644,176 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 通知卡→RPC -->
      <path d="M 560,288 H 636 Q 644,288 644,280 V 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- RPC→扫描 -->
      <line x1="852" y1="252" x2="852" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- RPC→导出引擎 (coral，绕左侧下行) -->
      <path d="M 700,252 V 414 H 716" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 扫描→工作区文件 -->
      <line x1="980" y1="352" x2="1016" y2="352" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 导出引擎→产物 (coral) -->
      <path d="M 736,412 H 488" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 目录选择器→RPC -->
      <path d="M 560,404 H 660 Q 668,404 668,396 V 264" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="140" y="156" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="160" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">使用</text>

      <rect x="572" y="148" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="606" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">host.call</text>

      <rect x="572" y="300" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="610" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pickDirectory</text>

      <rect x="604" y="392" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="401" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">导出 PNG/JPG</text>

      <rect x="862" y="266" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="884" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">扫描</text>

      <!-- Node: 用户 -->
      <rect x="76" y="144" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="76" y="144" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="84" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="98" y="161" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="140" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户</text>
      <text x="140" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DSH Web UI</text>

      <!-- Node: 画板页签 -->
      <rect x="300" y="132" width="260" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="132" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="308" y="140" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="330" y="149" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="430" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">画板页签 conversation.view</text>
      <text x="430" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">预览 · 宽度 · 深色 · 另存为 · 导出</text>

      <!-- Node: 通知卡 -->
      <rect x="300" y="252" width="260" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="252" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="308" y="260" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="328" y="269" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARD</text>
      <text x="430" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">产物通知卡 shell.overlay</text>
      <text x="430" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">实时缩略图 · 整卡拖动 · Finder 定位</text>

      <!-- Node: 目录选择器 -->
      <rect x="300" y="368" width="260" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="368" width="260" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="308" y="376" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="326" y="385" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OS</text>
      <text x="430" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">原生目录选择器</text>
      <text x="430" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">macOS save-as dialog</text>

      <!-- Node: RPC 处理器 (focal) -->
      <rect x="676" y="132" width="304" height="120" rx="6" fill="#f5f5f5"/>
      <rect x="676" y="132" width="304" height="120" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="684" y="140" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="702" y="149" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RPC</text>
      <text x="828" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">harness.handle × 4</text>
      <text x="828" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">canvas/list · canvas/read</text>
      <text x="828" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">canvas/export · canvas/reveal</text>
      <text x="828" y="226" fill="rgba(45,49,66,0.5)" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-style="italic">会话沙箱策略直传 · 双执行路径</text>

      <!-- Node: 工作区扫描 -->
      <rect x="724" y="304" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="724" y="304" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="732" y="312" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="746" y="321" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FS</text>
      <text x="828" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">工作区扫描</text>
      <text x="828" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fs + sessionQuery · 4s 签名轮询</text>

      <!-- Node: 导出引擎 -->
      <rect x="724" y="376" width="208" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="724" y="376" width="208" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="732" y="384" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="752" y="393" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHOT</text>
      <text x="828" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chrome 无头截图</text>
      <text x="828" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">后台启动 · 轮询杀进程 · 2x</text>
      <text x="828" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sips→JPG85 / cp→PNG</text>

      <!-- Node: 产物 -->
      <rect x="296" y="384" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="384" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="304" y="392" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="320" y="401" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="392" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PNG / JPG 产物</text>
      <text x="392" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3200×2400 · ~2s</text>

      <!-- 工作区文件 note（扫描的源头） -->
      <text x="1000" y="356" fill="rgba(45,49,66,0.45)" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">工作区 *.html</text>

      <!-- Legend -->
      <line x1="76" y1="512" x2="1004" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="76" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="76" y="540" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="96" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">RPC 核心（焦点）</text>
      <rect x="220" y="540" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">插件组件</text>
      <rect x="340" y="540" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">产物 / 数据</text>
      <line x1="470" y1="545" x2="498" y2="545" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="506" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">导出主流程</text>
      <line x1="610" y1="545" x2="638" y2="545" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="646" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">调用 / 挂载</text>
      <line x1="750" y1="545" x2="778" y2="545" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="786" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">系统服务</text>
    </svg>